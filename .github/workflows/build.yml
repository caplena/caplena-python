name: Build Pipeline

on: push

jobs:
  lint:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v4
        with:
          # pre-commit-hooks v5+ requires Python >=3.9
          python-version: '3.12'
      - run: pip install flit
      - run: make install
      - run: make lint

  test:
    name: Run tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install flit
      # Avoid `make install` (runs pre-commit); install runtime + test deps only
      - run: flit install --deps production --extras test --symlink
      - run: make test

  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: ${{ contains(fromJSON('["refs/heads/main", "refs/heads/develop"]'), github.ref) }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: pip install flit
      - run: make install
      - run: make build-docs
      - name: Push to docs-external-site
        uses: cpina/github-action-push-to-another-repository@v1.5
        env:
          SSH_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        with:
          destination-github-username: caplena
          destination-repository-name: docs-external-site
          source-directory: docs/build/html/
          target-directory: public/sdk/python/
          user-email: admin@caplena.com
          target-branch: main
          commit-message: Update SDK documentation ORIGIN_COMMIT
