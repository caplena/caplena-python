name: CI/CD

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest -q --ignore=tests/controllers

  quality:
    name: Format and type checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev]"

      - name: Check formatting with Black
        run: black --check caplena tests

      - name: Check import order with isort
        run: isort --check-only caplena tests

      - name: Run Flake8
        run: flake8 caplena tests

      - name: Run mypy
        run: mypy caplena tests

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs:
      - test
      - quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip build flit_core
          python -m build --no-isolation

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    needs:
      - quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[doc]"

      - name: Build Sphinx docs
        run: make build-docs

      - name: Push docs to external site
        if: github.event_name == 'push' && contains(fromJSON('["refs/heads/main", "refs/heads/develop"]'), github.ref)
        uses: cpina/github-action-push-to-another-repository@v1.5
        env:
          SSH_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        with:
          destination-github-username: caplena
          destination-repository-name: docs-external-site
          source-directory: docs/build/html/
          target-directory: public/sdk/python/
          user-email: admin@caplena.com
          target-branch: main
          commit-message: Update SDK documentation ORIGIN_COMMIT

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/caplena
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
